<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titanic Survival Prediction</title>
</head>
<body>

<h2>Titanic Survival Prediction</h2>

<p>Enter passenger details:</p>

<label>Pclass</label><br>
<input id="pclass" type="number" value="3"><br><br>

<label>Sex</label><br>
<input id="sex" type="text" value="male"><br><br>

<label>Age</label><br>
<input id="age" type="number" step="0.1" value="30"><br><br>

<label>SibSp</label><br>
<input id="sibsp" type="number" value="0"><br><br>

<label>Parch</label><br>
<input id="parch" type="number" value="0"><br><br>

<label>Fare</label><br>
<input id="fare" type="number" step="0.01" value="7.25"><br><br>

<label>Embarked</label><br>
<input id="embarked" type="text" value="S"><br><br>

<button onclick="predict()">Predict</button>

<hr>

<h3 id="result"></h3>

<script>
async function predict() {
    const data = [
        Number(document.getElementById("pclass").value),
        document.getElementById("sex").value,
        Number(document.getElementById("age").value),
        Number(document.getElementById("sibsp").value),
        Number(document.getElementById("parch").value),
        Number(document.getElementById("fare").value),
        document.getElementById("embarked").value
    ];

    const response = await fetch(
        "https://YOUR-RENDER-URL.onrender.com/predict",
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data })
        }
    );

    const result = await response.json();

    document.getElementById("result").innerText =
        `Survived: ${result.survived} | Probability: ${result.probability_survived}`;
}
</script>

</body>
</html>
